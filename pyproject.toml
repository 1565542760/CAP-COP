[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-cop-paper-methods"
version = "1.0.0rc1"
description = "Final CAP/COP paper methods, selected from the certified run sources"
requires-python = ">=3.9,<3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "scipy==1.13.1",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "SimpleITK==2.5.6",
]

[project.optional-dependencies]
radiomics = ["pyradiomics==3.1.0"]
imaging = ["torch>=2.0", "timm>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cap_cop = ["configs/clinical/*.json", "configs/paper/*.json", "configs/*.yaml"]
